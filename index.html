<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find Your Table</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fdf1f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #6e3b3b;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      padding: 50px 30px;
      text-align: center;
      border: 1px solid #f4d9d6;
      box-shadow: 0 10px 35px rgba(197, 90, 90, 0.12);
      position: relative;
    }

    .small-title {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: #c98a8a;
      margin-bottom: 15px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: normal;
      line-height: 1;
      margin: 0;
      color: #a94b4b;
    }

    .divider {
      margin: 22px 0;
      color: #e0a9a9;
      font-size: 20px;
      letter-spacing: 6px;
    }

    .instruction {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #a97d7d;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #f0d7d4;
      background: #fffaf9;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
      outline: none;
      color: #6e3b3b;
    }

    input:focus {
      border-color: #d98e8e;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      background: #c96a6a;
      color: white;
      border: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #b45555;
    }

    #result {
      margin-top: 30px;
      min-height: 70px;
    }

    .table-label {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: #c98a8a;
      margin-bottom: 5px;
    }

    .table-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 65px;
      color: #a94b4b;
      font-weight: bold;
      line-height: 1.1;
    }

    .error {
      font-family: Arial, sans-serif;
      color: #b23b3b;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      font-size: 17px;
      font-style: italic;
      color: #c48c8c;
    }

    @media (max-width: 500px) {
      .card {
        padding: 40px 25px;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="small-title">
      Welcome to the Big Fat Indian Wedding
    </div>

    <h1>
      Find Your<br>
      Table
    </h1>

    <div class="divider">
      ✦ ❦ ✦
    </div>

    <div class="instruction">
      Please enter your name below
    </div>

    <input
      type="text"
      id="nameInput"
      placeholder="Your full name"
      autocomplete="off"
    >

    <button onclick="findTable()">
      Find My Table
    </button>

    <div id="result"></div>

    <div class="footer">
      We can't wait to celebrate with you
    </div>

  </div>


<script>

  const spreadsheetId = "1_ZvRtd3DyjuwzDIJmdGdNLIgW8kEH1siYH_srOFuXCU";

  async function findTable() {

    const nameInput = document.getElementById("nameInput");
    const result = document.getElementById("result");

    const searchName = nameInput.value
      .trim()
      .toLowerCase();

    if (!searchName) {
      result.innerHTML =
        '<div class="error">Please enter your name.</div>';
      return;
    }

    result.innerHTML =
      '<div class="instruction">Finding your table...</div>';

    try {

      const url =
        `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv`;

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Could not load spreadsheet");
      }

      const csv = await response.text();

      // Properly handle CSV values, including names containing commas
      const rows = parseCSV(csv);

      // Remove header row
      const data = rows.slice(1);

      /*
        Spreadsheet format:

        First Name | Last Name | Phone Number | Table Number
        John       | Smith     | 0412 345 678 | 12
        Sarah      | Jones     | 0423 456 789 | 7
      */

      const people = data
        .filter(row => row.length >= 4)
        .map(row => ({
          firstName: row[0].trim(),
          lastName: row[1].trim(),
          phoneNumber: row[2].trim(),
          tableNumber: row[3].trim()
        }));

      /*
        Create full names and normalise everything
        so searches are not affected by capitalisation.
      */

      const matches = people.filter(person => {

        const firstName =
          person.firstName.toLowerCase();

        const lastName =
          person.lastName.toLowerCase();

        const fullName =
          `${firstName} ${lastName}`;

        return (
          fullName === searchName ||
          firstName === searchName ||
          lastName === searchName
        );

      });

      // No match
      if (matches.length === 0) {

        result.innerHTML =
          '<div class="error">' +
          'We couldn\'t find your name.<br>' +
          'Please check the spelling and try again.' +
          '</div>';

        return;
      }

      // Multiple matches - ask for phone number to disambiguate
      if (matches.length > 1) {

        showPhonePrompt(matches);
        return;
      }

      // One match
      showTableResult(matches[0]);

    } catch (error) {

      console.error(error);

      result.innerHTML =
        '<div class="error">' +
        'Something went wrong.<br>' +
        'Please try again.' +
        '</div>';

    }
  }


  /*
    When more than one person shares the same name,
    ask for a phone number to narrow it down to one.
  */

  function showPhonePrompt(candidates) {

    const result = document.getElementById("result");

    result.innerHTML = `
      <div class="instruction">
        We found more than one match. Please enter your phone number too.
      </div>

      <input
        type="tel"
        id="phoneInput"
        placeholder="Your phone number"
        inputmode="numeric"
        autocomplete="off"
      >

      <button id="phoneSubmit">
        Find My Table
      </button>

      <div id="phoneResult"></div>
    `;

    const phoneInput = document.getElementById("phoneInput");
    const phoneResult = document.getElementById("phoneResult");

    function resolveByPhone() {

      const searchPhone = phoneInput.value
        .trim()
        .replace(/\D/g, "");

      if (!searchPhone) {
        phoneResult.innerHTML =
          '<div class="error">Please enter your phone number.</div>';
        return;
      }

      const phoneMatches = candidates.filter(person => {

        const phoneDigits =
          person.phoneNumber.replace(/\D/g, "");

        return (
          phoneDigits === searchPhone ||
          phoneDigits.endsWith(searchPhone)
        );

      });

      if (phoneMatches.length === 0) {
        phoneResult.innerHTML =
          '<div class="error">' +
          'That number doesn\'t match either record.<br>' +
          'Please check the number and try again.' +
          '</div>';
        return;
      }

      // Still ambiguous even after phone match (rare) - show all
      if (phoneMatches.length > 1) {

        const tableList = phoneMatches
          .map(person => `<div class="table-number">${escapeHTML(person.tableNumber)}</div>`)
          .join("");

        phoneResult.innerHTML = `
          <div class="table-label">
            Your table is one of these
          </div>

          ${tableList}
        `;
        return;
      }

      showTableResult(phoneMatches[0]);

    }

    document
      .getElementById("phoneSubmit")
      .addEventListener("click", resolveByPhone);

    phoneInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        resolveByPhone();
      }
    });

  }


  function showTableResult(person) {

    const result = document.getElementById("result");

    result.innerHTML = `
      <div class="table-label">
        Your table is
      </div>

      <div class="table-number">
        ${escapeHTML(person.tableNumber)}
      </div>
    `;

  }


  /*
    Simple CSV parser.

    This is better than using row.split(",")
    because it correctly handles names containing
    commas or quotation marks.
  */

  function parseCSV(csv) {

    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < csv.length; i++) {

      const char = csv[i];
      const nextChar = csv[i + 1];

      if (char === '"' && insideQuotes && nextChar === '"') {

        cell += '"';
        i++;

      } else if (char === '"') {

        insideQuotes = !insideQuotes;

      } else if (char === "," && !insideQuotes) {

        row.push(cell);
        cell = "";

      } else if (
        (char === "\n" || char === "\r") &&
        !insideQuotes
      ) {

        if (char === "\r" && nextChar === "\n") {
          i++;
        }

        row.push(cell);
        rows.push(row);

        row = [];
        cell = "";

      } else {

        cell += char;

      }
    }

    // Add final cell/row
    if (cell !== "" || row.length > 0) {
      row.push(cell);
      rows.push(row);
    }

    return rows;
  }


  /*
    Prevent spreadsheet values from being interpreted
    as HTML when displayed on the page.
  */

  function escapeHTML(value) {

    return value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // Press Enter to search
  document
    .getElementById("nameInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        findTable();
      }

    });

</script>


</body>
</html>
