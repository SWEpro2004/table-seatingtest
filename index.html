<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 20px 0 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #222;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #result {
      margin-top: 25px;
      font-size: 24px;
      font-weight: bold;
    }

    .error {
      color: #d00;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Find Your Table</h1>
    <p>Enter your name below</p>

    <input
      type="text"
      id="nameInput"
      placeholder="Your name"
      autocomplete="off"
    >

    <button onclick="findTable()">Find My Table</button>

    <div id="result"></div>
  </div>

  <script>
    const spreadsheetId = "1_ZvRtd3DyjuwzDIJmdGdNLIgW8kEH1siYH_srOFuXCU";

    async function findTable() {
      const nameInput = document.getElementById("nameInput");
      const result = document.getElementById("result");

      const searchName = nameInput.value.trim().toLowerCase();

      if (!searchName) {
        result.innerHTML = '<div class="error">Please enter your name.</div>';
        return;
      }

      result.innerHTML = "Looking up...";

      try {
        const url =
          `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv`;

        const response = await fetch(url);
        const csv = await response.text();

        const rows = csv
          .trim()
          .split("\n")
          .map(row => row.split(",").map(cell =>
            cell.replace(/^"|"$/g, "").trim()
          ));

        // Skip the header row
        const data = rows.slice(1);

        const person = data.find(row =>
          row[0] && row[0].toLowerCase() === searchName
        );

        if (person) {
          result.innerHTML = `Your table is <strong>${person[1]}</strong>`;
        } else {
          result.innerHTML =
            '<div class="error">Sorry, we couldn\'t find your name.</div>';
        }

      } catch (error) {
        console.error(error);
        result.innerHTML =
          '<div class="error">Something went wrong. Please try again.</div>';
      }
    }

    // Allow pressing Enter instead of clicking the button
    document.getElementById("nameInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        findTable();
      }
    });
  </script>

</body>
</html>
