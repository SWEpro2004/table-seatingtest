<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Find Your Table</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f6f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #465144;
      font-family: Georgia, "Times New Roman", serif;
    }

    .card {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      padding: 50px 30px;
      text-align: center;
      border: 1px solid #ddd8cc;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .small-title {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: #9a8060;
      margin-bottom: 15px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 48px;
      font-weight: normal;
      line-height: 1;
      margin: 0;
      color: #465144;
    }

    .divider {
      margin: 22px 0;
      color: #b49a72;
      font-size: 20px;
      letter-spacing: 6px;
    }

    .instruction {
      font-family: Arial, sans-serif;
      font-size: 14px;
      color: #777;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d5d2c9;
      background: #faf9f6;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #9da994;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      background: #687563;
      color: white;
      border: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #566250;
    }

    #result {
      margin-top: 30px;
      min-height: 70px;
    }

    .table-label {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: #9a8060;
      margin-bottom: 5px;
    }

    .table-number {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 65px;
      color: #465144;
      font-weight: bold;
    }

    .error {
      font-family: Arial, sans-serif;
      color: #a45c54;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      font-size: 17px;
      font-style: italic;
      color: #888;
    }

    @media (max-width: 500px) {
      .card {
        padding: 40px 25px;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="small-title">
      Welcome to the Big Fat Indian Wedding
    </div>

    <h1>
      Find Your<br>
      Table
    </h1>

    <div class="divider">
      ✦ ❦ ✦
    </div>

    <div class="instruction">
      Please enter your name below
    </div>

    <input
      type="text"
      id="nameInput"
      placeholder="Your full name"
      autocomplete="off"
    >

    <button onclick="findTable()">
      Find My Table
    </button>

    <div id="result"></div>

    <div class="footer">
      We can't wait to celebrate with you
    </div>

  </div>


  <script>

    const spreadsheetId = "1_ZvRtd3DyjuwzDIJmdGdNLIgW8kEH1siYH_srOFuXCU";

    async function findTable() {

      const nameInput = document.getElementById("nameInput");
      const result = document.getElementById("result");

      const searchName = nameInput.value.trim().toLowerCase();

      if (!searchName) {
        result.innerHTML =
          '<div class="error">Please enter your name.</div>';
        return;
      }

      result.innerHTML =
        '<div class="instruction">Finding your table...</div>';

      try {

        const url =
          `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv`;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Could not load spreadsheet");
        }

        const csv = await response.text();

        const rows = csv
          .trim()
          .split("\n")
          .map(row =>
            row.split(",").map(cell =>
              cell.replace(/^"|"$/g, "").trim()
            )
          );

        const data = rows.slice(1);

        const person = data.find(row =>
          row[0] &&
          row[0].toLowerCase() === searchName
        );

        if (person) {

          result.innerHTML = `
            <div class="table-label">
              Your table is
            </div>

            <div class="table-number">
              ${person[1]}
            </div>
          `;

        } else {

          result.innerHTML =
            '<div class="error">' +
            'We couldn\'t find your name.<br>' +
            'Please check the spelling and try again.' +
            '</div>';

        }

      } catch (error) {

        console.error(error);

        result.innerHTML =
          '<div class="error">' +
          'Something went wrong.<br>' +
          'Please try again.' +
          '</div>';

      }
    }


    document
      .getElementById("nameInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          findTable();
        }

      });

  </script>

</body>
</html>
