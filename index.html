<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Table</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at top, rgba(255,255,255,.16), transparent 35%),
      linear-gradient(135deg, #6d1f2f, #9d3f4e 50%, #4d1421);
    color: #fff;
  }
  .card {
    width: min(560px, 100%);
    padding: 42px 30px;
    text-align: center;
    background: rgba(255,255,255,.96);
    color: #34131b;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
  }
  .ornament { font-size: 30px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: clamp(32px, 8vw, 52px); }
  .subtitle {
    margin: 10px 0 28px;
    font-family: Arial, sans-serif;
    color: #6d5660;
  }
  input {
    width: 100%;
    padding: 17px 18px;
    border: 2px solid #e2c8ce;
    border-radius: 12px;
    font-size: 18px;
    outline: none;
  }
  input:focus { border-color: #9d3f4e; }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #7f2638;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #681d2d; }
  #result {
    margin-top: 24px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .found {
    width: 100%;
    padding: 22px;
    border-radius: 16px;
    background: #f8e9ed;
  }
  .found .name { font-size: 21px; }
  .table {
    margin-top: 6px;
    font-size: 42px;
    font-weight: bold;
    color: #7f2638;
  }
  .error {
    color: #a52a3e;
    font-family: Arial, sans-serif;
    font-weight: 600;
  }
  .hint {
    margin-top: 24px;
    color: #8a747b;
    font: 13px Arial, sans-serif;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="ornament">✦</div>
    <h1>Find Your Table</h1>
    <p class="subtitle">Enter your name below to find your table.</p>

    <form id="lookupForm">
      <input id="nameInput" type="text" placeholder="Enter your name" autocomplete="off" autofocus>
      <button type="submit">Find My Table</button>
    </form>

    <div id="result" aria-live="polite"></div>
    <div class="hint">8 seating entries loaded from the spreadsheet</div>
  </main>

<script>
const seating = {'a': '1', 'b': '2', 'c': '3', 'd': '4', 'e': '5', 'f': '6', 'g': '7', 'h': '8'};

function findTable(input) {
  const cleaned = input.trim().toCaseFold ? input.trim().toCaseFold() : input.trim().toLowerCase();
  return seating[cleaned];
}

document.getElementById("lookupForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const input = document.getElementById("nameInput").value;
  const key = input.trim().toLowerCase();
  const result = document.getElementById("result");

  if (!key) {
    result.innerHTML = '<div class="error">Please enter your name.</div>';
    return;
  }

  const table = seating[key];

  if (table !== undefined) {
    const displayName = input.trim().replace(/\s+/g, " ");
    result.innerHTML = `
      <div class="found">
        <div class="name">Welcome, <strong>${escapeHtml(displayName)}</strong>!</div>
        <div class="table">Table ${escapeHtml(String(table))}</div>
      </div>`;
  } else {
    result.innerHTML = '<div class="error">Sorry, we couldn\'t find your name.<br>Please check the spelling and try again.</div>';
  }
});

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, function(char) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char];
  });
}
</script>
</body>
</html>
